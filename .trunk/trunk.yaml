# =============================================================================
# Trunk.io — Plugin versions for linting/formatting tools
# =============================================================================
# This file is auto-generated. Run `trunk upgrade` to update.
# https://docs.trunk.io/check/reference
# =============================================================================

plugins:
  sources:
    - id: trunk
      ref: v1.2.2
    - id: community
      ref: main

# Linters (auto-detected by file type)
linters:
  actionlint:
    enabled: true
    commands:
      - name: actionlint
        run: actionlint ${target}
        direct_configs:
          - .github/workflows/*.yml
  black:
    enabled: true
    commands:
      - name: black
        run: black --check --line-length 100 ${target}
        direct_configs:
          - pyproject.toml
          - ruff.toml
  clippy:
    enabled: true
    commands:
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
  eslint:
    enabled: true
    direct_configs:
      - .eslintrc.*
      - eslint.config.*
  golangci-lint:
    enabled: true
    direct_configs:
      - .golangci.yml
      - .golangci.yaml
  mypy:
    enabled: true
    commands:
      - name: mypy
        run: mypy --ignore-missing-imports ${target}
  ruff:
    enabled: true
    commands:
      - name: ruff
        run: ruff check --output-format=github ${target}
        direct_configs:
          - ruff.toml
          - pyproject.toml
  shellcheck:
    enabled: true
  taplo:
    enabled: true
  yamllint:
    enabled: true

# Formatters
formatters:
  black:
    enabled: true
    commands:
      - name: black
        run: black --line-length 100 ${target}
        direct_configs:
          - pyproject.toml
  prettier:
    enabled: true
    direct_configs:
      - .prettierrc
      - prettier.config.*
  rustfmt:
    enabled: true
    commands:
      - name: rustfmt
        run: rustfmt ${target}

# Actions (CI optimization)
actions:
  trunk-check:
    enabled: true
    size: 5GB
    memory: 16GB
    disk: 10GB
  trunk-merge:
    enabled: true
    size: 5GB
  trunk-push:
    enabled: true
    size: 5GB

# Caching
cache:
  enabled: true
  storage: local

# CLI
cli:
  version: 1.22.2

# Environment
env:
  variables:
    EDITOR: vim
