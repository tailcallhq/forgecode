name: Observability Dashboard

on:
  schedule:
    - cron: "0 10 * * 1"  # Weekly Monday 10:00 UTC
  workflow_dispatch:
    inputs:
      action:
        description: "Action: generate or export"
        required: true
        default: "generate"

jobs:
  dashboard:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate Observability Dashboard
        run: |
          echo "# Observability Dashboard — $(date -u +%Y-%m-%d)" > dashboard.md
          echo "" >> dashboard.md
          echo "## CI/CD Pipeline Health" >> dashboard.md
          echo "" >> dashboard.md
          echo "| Workflow | Status | Last Run |" >> dashboard.md
          echo "|----------|--------|----------|" >> dashboard.md

          # Get last 5 workflow runs
          gh run list --limit 5 --json name,status,conclusion,createdAt \
            -q '.[] | "| \(.name) | \(.conclusion // .status) | \(.createdAt) |"' >> dashboard.md || true

          echo "" >> dashboard.md
          echo "## Coverage Trend" >> dashboard.md
          echo "" >> dashboard.md
          echo "_Coverage ratchet baseline established. Monitoring PR regressions._" >> dashboard.md
          echo "" >> dashboard.md
          echo "## Alert Summary" >> dashboard.md
          echo "" >> dashboard.md
          echo "- No active alerts" >> dashboard.md

      - name: Post Dashboard Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(cat dashboard.md)
          gh issue create \
            --title "Observability Dashboard — $(date -u +%Y-%m-%d)" \
            --body "$BODY" \
            --label "observability,automated" || echo "Failed to create issue"
