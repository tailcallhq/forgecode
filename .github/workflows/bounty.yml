name: Bounty Management
on:
  schedule:
  - cron: 0 2 * * *
  pull_request:
    types:
    - opened
    - edited
    - reopened
  pull_request_target:
    types:
    - closed
  issues:
    types:
    - assigned
    - unassigned
    - labeled
    - unlabeled
permissions:
  issues: read
  pull-requests: read
jobs:
  sync-all-issues:
    name: Sync all bounty issues
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Install npm packages
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Sync all bounty labels
      run: npx -y tsx@4.20.6 .github/scripts/bounty/src/sync-all-issues.ts --repo ${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --execute
  sync-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    name: Sync PR bounty labels
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Install npm packages
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Sync bounty labels
      run: npx -y tsx@4.20.6 .github/scripts/bounty/src/sync-pr.ts --pr ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --execute
