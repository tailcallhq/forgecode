name: Github Label Sync
on:
  push:
    branches:
    - main
permissions:
  contents: read
  issues: read
jobs:
  label-sync:
    name: label-sync
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Sync labels
      run: |-
        npx -y github-label-sync@3.0.0 \
          --access-token ${{ secrets.GITHUB_TOKEN }} \
          --labels ".github/labels.json" \
          ${{ github.repository }}
