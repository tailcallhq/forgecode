name: CodeQL

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  merge_group:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Initialize CodeQL
        uses: github/codeql-action/init@adfda868f108ac4222129de456ea554034a27db7
        with:
          languages: rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@adfda868f108ac4222129de456ea554034a27db7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@adfda868f108ac4222129de456ea554034a27db7
