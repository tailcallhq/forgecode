name: ci
on:
  push:
    branches:
    - main
    tags:
    - v*
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
    branches:
    - main
permissions:
  contents: read
env:
  RUSTFLAGS: -Dwarnings
  OPENROUTER_API_KEY: ${{secrets.OPENROUTER_API_KEY}}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Setup Protobuf Compiler
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Rust Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      with:
        toolchain: stable
    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov
    - name: Generate coverage
      run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
  zsh_rprompt_perf:
    name: 'Performance: zsh rprompt'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Setup Protobuf Compiler
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Rust Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      with:
        toolchain: stable
    - name: Run performance benchmark
      run: ./scripts/benchmark.sh --threshold 60 zsh rprompt
  draft_release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Draft Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pull-requests: write
    outputs:
      crate_release_name: ${{ steps.set_output.outputs.crate_release_name }}
      crate_release_id: ${{ steps.set_output.outputs.crate_release_id }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - id: create_release
      name: Draft Release
      uses: release-drafter/release-drafter@5a60cd8ddda6dc14fce77159675b8fd2cdca4007
      with:
        config-name: release-drafter.yml
        version: 2.13.21-h.0.1.5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - id: set_output
      name: Export Outputs
      run: echo "crate_release_id=${{ steps.create_release.outputs.id }}" >> "$GITHUB_OUTPUT" && echo "crate_release_name=${{ steps.create_release.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
  draft_release_pr:
    if: 'github.event_name == ''pull_request'' && contains(github.event.pull_request.labels.*.name, ''ci: build all targets'')'
    name: Draft Release for PR
    runs-on: ubuntu-latest
    outputs:
      crate_release_name: ${{ steps.set_output.outputs.crate_release_name }}
      crate_release_id: ${{ steps.set_output.outputs.crate_release_id }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - id: set_output
      name: Set Release Version
      run: echo "crate_release_name=pr-build-${{ github.event.number }}" >> "$GITHUB_OUTPUT" && echo "crate_release_id=pr-build-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
  build_release_pr:
    if: 'github.event_name == ''pull_request'' && contains(github.event.pull_request.labels.*.name, ''ci: build all targets'')'
    name: build-release
    runs-on: ${{ matrix.os }}
    needs: draft_release_pr
    strategy:
      matrix:
        include:
        - binary_name: forge-x86_64-unknown-linux-musl
          binary_path: target/x86_64-unknown-linux-musl/release/forge
          cross: 'true'
          helioslite_name: helioslite-x86_64-unknown-linux-musl
          os: ubuntu-latest
          target: x86_64-unknown-linux-musl
        - binary_name: forge-aarch64-unknown-linux-musl
          binary_path: target/aarch64-unknown-linux-musl/release/forge
          cross: 'true'
          helioslite_name: helioslite-aarch64-unknown-linux-musl
          os: ubuntu-latest
          target: aarch64-unknown-linux-musl
        - binary_name: forge-x86_64-unknown-linux-gnu
          binary_path: target/x86_64-unknown-linux-gnu/release/forge
          cross: 'false'
          helioslite_name: helioslite-x86_64-unknown-linux-gnu
          os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
        - binary_name: forge-aarch64-unknown-linux-gnu
          binary_path: target/aarch64-unknown-linux-gnu/release/forge
          cross: 'true'
          helioslite_name: helioslite-aarch64-unknown-linux-gnu
          os: ubuntu-latest
          target: aarch64-unknown-linux-gnu
        - binary_name: forge-x86_64-apple-darwin
          binary_path: target/x86_64-apple-darwin/release/forge
          cross: 'false'
          helioslite_name: helioslite-x86_64-apple-darwin
          os: macos-latest
          target: x86_64-apple-darwin
        - binary_name: forge-aarch64-apple-darwin
          binary_path: target/aarch64-apple-darwin/release/forge
          cross: 'false'
          helioslite_name: helioslite-aarch64-apple-darwin
          os: macos-latest
          target: aarch64-apple-darwin
        - binary_name: forge-x86_64-pc-windows-msvc.exe
          binary_path: target/x86_64-pc-windows-msvc/release/forge.exe
          cross: 'false'
          helioslite_name: helioslite-x86_64-pc-windows-msvc.exe
          helper_name: helioslite_helper-x86_64-pc-windows-msvc.exe
          helper_path: target/x86_64-pc-windows-msvc/release/helioslite_helper.exe
          os: windows-latest
          target: x86_64-pc-windows-msvc
        - binary_name: forge-aarch64-pc-windows-msvc.exe
          binary_path: target/aarch64-pc-windows-msvc/release/forge.exe
          cross: 'false'
          helioslite_name: helioslite-aarch64-pc-windows-msvc.exe
          helper_name: helioslite_helper-aarch64-pc-windows-msvc.exe
          helper_path: target/aarch64-pc-windows-msvc/release/helioslite_helper.exe
          os: windows-latest
          target: aarch64-pc-windows-msvc
        - binary_name: forge-aarch64-linux-android
          binary_path: target/aarch64-linux-android/release/forge
          cross: 'true'
          helioslite_name: helioslite-aarch64-linux-android
          os: ubuntu-latest
          target: aarch64-linux-android
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - if: ${{ matrix.cross == 'false' }}
      name: Setup Protobuf Compiler
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - if: ${{ matrix.cross == 'false' }}
      name: Setup Cross Toolchain
      uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8
      with:
        target: ${{ matrix.target }}
    - if: ${{ matrix.cross == 'false' }}
      name: Add Rust target
      run: rustup target add ${{ matrix.target }}
    - if: '!(contains(matrix.target, ''-unknown-linux-'') || contains(matrix.target, ''-android''))'
      name: Set Rust Flags
      run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
    - name: Build Binary
      uses: ClementTsang/cargo-action@2438cc5f3ba4e971289fffca2a00dedea6911f14
      with:
        command: build --release
        args: --target ${{ matrix.target }}
        use-cross: ${{ matrix.cross }}
        cross-version: 0.2.5
      env:
        POSTHOG_API_SECRET: ${{secrets.POSTHOG_API_SECRET}}
        APP_VERSION: ${{ needs.draft_release_pr.outputs.crate_release_name }}
    - name: Build forge_dbd Binary
      uses: ClementTsang/cargo-action@2438cc5f3ba4e971289fffca2a00dedea6911f14
      with:
        command: build --release
        args: --target ${{ matrix.target }} -p forge_dbd
        use-cross: ${{ matrix.cross }}
        cross-version: 0.2.5
      env:
        APP_VERSION: ${{ needs.draft_release_pr.outputs.crate_release_name }}
    - if: contains(matrix.target, 'windows')
      name: Build helioslite_helper Binary
      uses: ClementTsang/cargo-action@2438cc5f3ba4e971289fffca2a00dedea6911f14
      with:
        command: build --release
        args: --target ${{ matrix.target }} -p forge_main --bin helioslite_helper
        use-cross: ${{ matrix.cross }}
        cross-version: 0.2.5
      env:
        APP_VERSION: ${{ needs.draft_release_pr.outputs.crate_release_name }}
