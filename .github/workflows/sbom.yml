name: SBOM Generation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate SBOM (SPDX)
        run: syft dir:. -o spdx-json=sbom-spdx.json -o cyclonedx-json=sbom-cyclonedx.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.json
          retention-days: 90
      - name: Attach SBOM to release
        if: github.event_name == 'release'
        run: |
          gh release upload ${{ github.event.release.tag_name }} sbom-spdx.json sbom-cyclonedx.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
