# Pull repository secrets from Infisical when explicitly requested.
name: Infisical Sync

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-secrets:
    name: Pull secrets from Infisical
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Infisical CLI
        run: |
          curl -1sLf "https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh" | sudo -E bash
          sudo apt-get install -y infisical

      - name: Pull secrets to environment
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID || secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_ENV: ${{ vars.INFISICAL_ENV || 'dev' }}
        run: |
          test -n "$INFISICAL_TOKEN" || { echo "::error::INFISICAL_TOKEN is not configured"; exit 1; }
          test -n "$INFISICAL_PROJECT_ID" || { echo "::error::INFISICAL_PROJECT_ID is not configured"; exit 1; }
          infisical run \
            --projectId "$INFISICAL_PROJECT_ID" \
            --env "$INFISICAL_ENV" \
            --token "$INFISICAL_TOKEN" \
            -- bash -c 'echo "Secrets loaded into environment"'