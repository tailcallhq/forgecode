name: autofix.ci
on:
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - main
permissions:
  contents: read
env:
  RUSTFLAGS: -Dwarnings
concurrency:
  group: autofix-${{github.ref}}
  cancel-in-progress: false
jobs:
  lint:
    name: Lint Fix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Install SQLite
      run: sudo apt-get install -y libsqlite3-dev
    - name: Setup Protobuf Compiler
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Rust Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      with:
        components: clippy, rustfmt
    - name: Cargo Clippy
      run: cargo clippy --all-features --workspace --all-targets -- -D warnings
    - name: Cargo Clippy String Safety
      run: cargo clippy --all-features --workspace -- -D clippy::string_slice -D clippy::indexing_slicing -D clippy::disallowed_methods
