[package]
name = "forge_sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sandboxed code execution for HeliosLite AI agent — OS-level process isolation with platform-specific backends"
homepage.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bstr = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync"] }
tracing.workspace = true
schemars.workspace = true
tempfile.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
# landlock-runtime: enable real Landlock LSM plumbing on Linux.
# When disabled (default), setup_landlock() is a no-op stub.
landlock-runtime = []

[lints.rust]
unknown_lints = "allow"
