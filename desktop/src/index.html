<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ForgeCode</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #16213e;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #0f3460;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #e94560;
    }

    header .version {
      font-size: 12px;
      color: #888;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .message {
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 80%;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      background: #0f3460;
      align-self: flex-end;
      margin-left: auto;
    }

    .message.assistant {
      background: #16213e;
      border: 1px solid #0f3460;
      align-self: flex-start;
    }

    .message.system {
      background: #1a1a2e;
      border: 1px solid #333;
      color: #999;
      font-size: 13px;
      max-width: 100%;
    }

    #input-bar {
      display: flex;
      gap: 8px;
      padding: 16px 24px;
      background: #16213e;
      border-top: 1px solid #0f3460;
    }

    #input-bar textarea {
      flex: 1;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      color: #e0e0e0;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 160px;
    }

    #input-bar textarea:focus {
      outline: none;
      border-color: #e94560;
    }

    #input-bar button {
      background: #e94560;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    #input-bar button:hover {
      background: #c73652;
    }

    #input-bar button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #status-bar {
      padding: 4px 24px;
      background: #0f3460;
      font-size: 11px;
      color: #888;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <header>
    <h1>ForgeCode</h1>
    <span class="version" id="version">loading...</span>
  </header>

  <main>
    <div id="messages">
      <div class="message system">
        Welcome to ForgeCode Desktop. Type a message below to start a conversation with the AI coding agent.
      </div>
    </div>

    <div id="input-bar">
      <textarea id="prompt" placeholder="Ask ForgeCode anything..." rows="1"></textarea>
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </main>

  <div id="status-bar">
    <span id="status">Ready</span>
    <span id="model-info">No model selected</span>
  </div>

  <script>
    const { invoke } = window.__TAURI__?.core || window.__TAURI__?.tauri?.invoke || {};

    const messagesEl = document.getElementById('messages');
    const promptEl   = document.getElementById('prompt');
    const sendBtn    = document.getElementById('send-btn');
    const statusEl   = document.getElementById('status');
    const versionEl  = document.getElementById('version');
    const modelEl    = document.getElementById('model-info');

    // --- Auto-resize textarea ---
    promptEl.addEventListener('input', () => {
      promptEl.style.height = 'auto';
      promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + 'px';
    });

    // --- Send on Enter (Shift+Enter for newline) ---
    promptEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function addMessage(text, cls) {
      const div = document.createElement('div');
      div.className = 'message ' + cls;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function loadConfig() {
      if (!invoke) { versionEl.textContent = 'Tauri not available'; return; }
      try {
        const config = await invoke('get_config');
        versionEl.textContent = 'v' + config.version;
        modelEl.textContent  = config.session || 'No model selected';
        addMessage('Connected to ForgeCode at ' + config.cwd, 'system');
      } catch (err) {
        versionEl.textContent = 'config error';
        addMessage('Failed to load config: ' + err, 'system');
      }
    }

    async function sendMessage() {
      const text = promptEl.value.trim();
      if (!text) return;
      if (!invoke) {
        addMessage('Tauri invoke bridge not available. Run with `cargo tauri dev`.', 'system');
        return;
      }

      addMessage(text, 'user');
      promptEl.value = '';
      promptEl.style.height = 'auto';
      sendBtn.disabled = true;
      statusEl.textContent = 'Thinking...';

      try {
        const result = await invoke('chat', { payload: { message: text } });
        addMessage(result.response || '(empty response)', 'assistant');
      } catch (err) {
        addMessage('Error: ' + err, 'system');
      } finally {
        sendBtn.disabled = false;
        statusEl.textContent = 'Ready';
        promptEl.focus();
      }
    }

    // --- Initialise ---
    loadConfig();
  </script>
</body>
</html>
